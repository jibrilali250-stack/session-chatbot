<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
        }

        #newChatBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        #newChatBtn:hover {
            background: #0056b3;
        }

        #chatContainer {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.error {
            align-self: center;
            max-width: 90%;
        }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: #007bff;
            color: white;
        }

        .message.assistant .bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message.error .bubble {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            text-align: center;
        }

        .metadata {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
            padding: 0 0.5rem;
        }

        .message.user .metadata {
            text-align: right;
        }

        .guardrail-note {
            font-size: 0.8rem;
            color: #856404;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            margin-top: 0.25rem;
        }

        .thinking {
            font-style: italic;
            color: #888;
        }

        #inputArea {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            min-height: 2.5rem;
            max-height: 10rem;
        }

        #messageInput:focus {
            outline: none;
            border-color: #007bff;
        }

        #sendBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            align-self: flex-end;
        }

        #sendBtn:hover:not(:disabled) {
            background: #0056b3;
        }

        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chatbot</h1>
        <button id="newChatBtn">New chat</button>
    </header>

    <div id="chatContainer"></div>

    <div id="inputArea">
        <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        let sessionId = null;
        let isWaiting = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        });

        // Send on Enter, new line on Shift+Enter
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        newChatBtn.addEventListener('click', startNewChat);

        // Initialize on load
        init();

        async function init() {
            const savedSessionId = sessionStorage.getItem('session_id');
            
            if (savedSessionId) {
                try {
                    const response = await fetch(`${API_BASE}/sessions/${savedSessionId}`);
                    if (response.ok) {
                        const data = await response.json();
                        sessionId = savedSessionId;
                        restoreMessages(data.messages || []);
                        return;
                    }
                } catch (err) {
                    console.error('Failed to restore session:', err);
                }
            }

            // Create new session
            await createSession();
        }

        async function createSession() {
            try {
                const response = await fetch(`${API_BASE}/sessions`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error(`Failed to create session: ${response.status}`);
                }
                const data = await response.json();
                sessionId = data.session_id;
                sessionStorage.setItem('session_id', sessionId);
                chatContainer.innerHTML = '';
            } catch (err) {
                showError('Unable to connect to the chatbot. Please check that the server is running and try again.');
                console.error(err);
            }
        }

        async function startNewChat() {
            if (sessionId) {
                try {
                    await fetch(`${API_BASE}/sessions/${sessionId}`, { method: 'DELETE' });
                } catch (err) {
                    console.error('Failed to delete session:', err);
                }
            }
            
            sessionStorage.removeItem('session_id');
            await createSession();
        }

        function restoreMessages(messages) {
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                if (msg.role === 'user') {
                    addMessage('user', msg.content);
                } else if (msg.role === 'assistant') {
                    addMessage('assistant', msg.content, msg.metadata);
                }
            });
            scrollToBottom();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isWaiting || !sessionId) return;

            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Show thinking indicator
            const thinkingId = addThinking();
            isWaiting = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message })
                });

                removeThinking(thinkingId);

                if (response.status === 404) {
                    // Session not found, create new one
                    await createSession();
                    showError('Your session expired. A new chat has been started.');
                    return;
                }

                if (!response.ok) {
                    if (response.status === 422) {
                        const error = await response.json();
                        showError(`Invalid input: ${error.detail}`);
                    } else if (response.status === 502) {
                        showError('The AI service is temporarily unavailable. Please try again.');
                    } else {
                        showError('Something went wrong. Please try again.');
                    }
                    return;
                }

                const data = await response.json();
                const metadata = {
                    input_tokens: data.input_tokens,
                    output_tokens: data.output_tokens,
                    seconds: data.seconds,
                    cost: data.cost,
                    guardrail: data.guardrail
                };
                addMessage('assistant', data.reply, metadata);

            } catch (err) {
                removeThinking(thinkingId);
                showError('Unable to reach the chatbot. Please check your connection and try again.');
                console.error(err);
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(role, content, metadata = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            msgDiv.appendChild(bubble);

            if (metadata && role === 'assistant') {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'metadata';
                
                const costStr = metadata.cost !== null ? `$${metadata.cost.toFixed(4)}` : 'N/A';
                metaDiv.textContent = `${metadata.input_tokens} in / ${metadata.output_tokens} out · ${metadata.seconds.toFixed(2)}s · ${costStr}`;
                msgDiv.appendChild(metaDiv);

                if (metadata.guardrail) {
                    const guardDiv = document.createElement('div');
                    guardDiv.className = 'guardrail-note';
                    guardDiv.textContent = `⚠ ${metadata.guardrail}`;
                    msgDiv.appendChild(guardDiv);
                }
            }

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function addThinking() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.id = 'thinking-indicator';

            const bubble = document.createElement('div');
            bubble.className = 'bubble thinking';
            bubble.textContent = 'thinking...';
            msgDiv.appendChild(bubble);

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return 'thinking-indicator';
        }

        function removeThinking(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function showError(message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message error';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = message;
            msgDiv.appendChild(bubble);

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
